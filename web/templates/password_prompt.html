<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo | Enter Password</title>
    <link id="theme-css" rel="stylesheet" href="/static/modern.css?v=2">
    <style>
        .field-row {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        body.cs16-theme {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        body.cs16-theme .window {
            max-width: 400px;
            width: 100%;
        }
        body.cs16-theme input[type="password"] {
            background-color: #2b312b;
            color: #d1d1d1;
            padding: 6px;
            border: 2px inset #5a645a;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
        }
    </style>
    <script>
        function applyTheme() {
            const theme = localStorage.getItem('theme') || 'modern';
            const link = document.getElementById('theme-css');
            if (theme === 'cs16') {
                link.href = "https://cdn.jsdelivr.net/gh/ekmas/cs16.css@main/css/cs16.min.css";
                document.body.classList.add('cs16-theme');
            } else {
                link.href = "/static/modern.css?v=2";
                document.body.classList.remove('cs16-theme');
            }
        }
        document.addEventListener('DOMContentLoaded', applyTheme);
    </script>
</head>
<body>
    <div class="window container">
        <div class="title-bar">
            <div class="title-bar-text">Protected Room</div>
            <div class="title-bar-controls">
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <header class="header" style="margin-bottom: 20px;">
                <h1>Room requires password</h1>
            </header>
            <form action="/room/{{.Slug}}/auth" method="POST">
                <div class="field-row">
                    <label>Password</label>
                    <input type="password" name="password" required autofocus>
                </div>
                <div class="actions">
                    <button type="submit" class="cs-btn submit-btn">Join Room</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
