<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo | Create Server</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link id="theme-css" rel="stylesheet" href="/static/modern.css">
    <style>
        .field-row {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .field-row-checkbox {
            flex-direction: row;
            align-items: center;
        }
        body.cs16-theme {
            padding: 40px 20px;
        }
        body.cs16-theme .window {
            margin: 0 auto;
        }
        body.cs16-theme input[type="number"], 
        body.cs16-theme select, 
        body.cs16-theme textarea {
            background-color: #2b312b;
            color: #d1d1d1;
            padding: 6px;
            border: 2px inset #5a645a;
        }
    </style>
    <script>
        function toggleTheme() {
            const current = localStorage.getItem('theme') || 'modern';
            const next = current === 'modern' ? 'cs16' : 'modern';
            localStorage.setItem('theme', next);
            applyTheme(next);
        }
        function applyTheme(theme) {
            const link = document.getElementById('theme-css');
            if (theme === 'cs16') {
                link.href = "https://cdn.jsdelivr.net/gh/ekmas/cs16.css@main/css/cs16.min.css";
                document.body.classList.add('cs16-theme');
            } else {
                link.href = "/static/modern.css";
                document.body.classList.remove('cs16-theme');
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(localStorage.getItem('theme') || 'modern');
        });
    </script>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">Bingo Server Setup</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <header class="header">
                <h1>Create Server</h1>
                <button class="cs-btn" type="button" onclick="toggleTheme()">Switch Theme</button>
            </header>
            <form action="/rooms" method="POST" class="form-container">
                <div class="field-row">
                    <label>Game Mode</label>
                    <select name="mode" class="cs-select">
                        <option value="0">Competitive</option>
                        <option value="1">Collaborative</option>
                    </select>
                </div>
                <div class="field-row">
                    <label>Grid Size</label>
                    <input type="number" name="size" value="5" min="3" max="10">
                </div>
                <div class="field-row field-row-checkbox">
                    <input type="checkbox" name="freeSpace" id="freeSpace" value="true" checked>
                    <label for="freeSpace">Center Free Space</label>
                </div>
                <div class="field-row">
                    <label>Wordlist (comma separated)</label>
                    <textarea name="wordlist" rows="6">apple, banana, cherry, date, elderberry, fig, grape, honeydew, kiwi, lemon, mango, nectarine, orange, papaya, quince, raspberry, strawberry, tangerine, ugli, vanilla, watermelon, xigua, yam, zucchini, apricot</textarea>
                </div>
                <div class="actions">
                    <button type="submit" class="cs-btn submit-btn">Start Game</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
