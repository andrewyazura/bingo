<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo | Room</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/ws.js"></script>
    <link id="theme-css" rel="stylesheet" href="/static/modern.css?v=2">
    <style>
        body.cs16-theme {
            padding: 40px 20px;
        }
        body.cs16-theme .window {
            margin: 0 auto;
        }
        body.cs16-theme .tile {
            background-color: var(--secondary-bg);
            border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
            color: var(--text);
            border-style: solid;
            border-width: 2px;
            border-radius: 0; 
        }
        body.cs16-theme .tile:hover {
            background-color: var(--scrollbar-track);
        }
        body.cs16-theme .tile.marked {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        body.cs16-theme .mini-tile.marked {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        body.cs16-theme .tile.opponent-marked {
            animation: opponent-ping-cs16 0.8s step-end;
        }
        @keyframes opponent-ping-cs16 {
            0% { background-color: var(--accent); color: #000; border-color: var(--accent); }
            25% { background-color: var(--secondary-bg); color: var(--text); border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light); }
            50% { background-color: var(--accent); color: #000; border-color: var(--accent); }
            75% { background-color: var(--secondary-bg); color: var(--text); border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light); }
            100% {}
        }
        body.cs16-theme .log-entry {
            animation: none;
            border-radius: 0;
            border-left-color: var(--accent);
        }
        body.cs16-theme .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }
        body.cs16-theme .header h1 {
            margin: 0;
            font-size: 20px;
        }
    </style>
    <script>
        function toggleTheme() {
            const current = localStorage.getItem('theme') || 'modern';
            const next = current === 'modern' ? 'cs16' : 'modern';
            localStorage.setItem('theme', next);
            applyTheme(next);
        }
        function applyTheme(theme) {
            const link = document.getElementById('theme-css');
            if (theme === 'cs16') {
                link.href = "https://cdn.jsdelivr.net/gh/ekmas/cs16.css@main/css/cs16.min.css";
                document.body.classList.add('cs16-theme');
            } else {
                link.href = "/static/modern.css?v=2";
                document.body.classList.remove('cs16-theme');
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(localStorage.getItem('theme') || 'modern');
        });
        
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            const btn = document.getElementById('copy-btn');
            const originalText = btn.innerText;
            btn.innerText = 'Copied!';
            setTimeout(() => { btn.innerText = originalText; }, 2000);
        }

        function copyWordleResult() {
            const tiles = document.querySelectorAll('#game-board-container .tile');
            if (tiles.length === 0) return;
            const size = Math.sqrt(tiles.length);
            let result = `Bingo Room {{.Slug}}\n\n`;
            for (let i = 0; i < tiles.length; i++) {
                if (tiles[i].classList.contains('marked')) {
                    result += '🟩';
                } else {
                    result += '⬜';
                }
                if ((i + 1) % size === 0) {
                    result += '\n';
                }
            }
            navigator.clipboard.writeText(result).then(() => {
                const btn = document.getElementById('share-btn');
                const originalText = btn.innerText;
                btn.innerText = 'Copied!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            });
        }

        function highlightWord(word) {
            const tiles = document.querySelectorAll('#game-board-container .tile');
            for (let i = 0; i < tiles.length; i++) {
                if (tiles[i].innerText.trim() === word.trim()) {
                    tiles[i].classList.remove('opponent-marked');
                    // force reflow
                    void tiles[i].offsetWidth;
                    const tile = tiles[i];
                    tile.classList.add('opponent-marked');
                    
                    const onAnimationEnd = () => {
                        tile.classList.remove('opponent-marked');
                        tile.removeEventListener('animationend', onAnimationEnd);
                    };
                    tile.addEventListener('animationend', onAnimationEnd);
                    break;
                }
            }
        }
    </script>
    <style>
        .board {
            display: grid;
            gap: 8px;
            margin-top: 24px;
            width: 100%;
        }
        .tile {
            aspect-ratio: 1 / 1;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px;
            font-size: clamp(10px, 2.5vw, 14px);
            font-weight: 600;
            cursor: pointer;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            hyphens: auto;
            overflow: hidden;
            transition: transform 0.1s, border-color 0.2s, background-color 0.2s;
            /* Remove default button styles */
            outline: none;
        }
        .tile:hover {
            border-color: var(--accent-color);
            background-color: #333;
        }
        .tile.marked {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .tile.opponent-marked {
            animation: opponent-ping 1s ease-out;
        }
        @keyframes opponent-ping {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.5); }
            20% { transform: scale(1.05); box-shadow: inset 0 0 20px var(--accent-color); border-color: var(--accent-color); }
            100% { transform: scale(1); box-shadow: inset 0 0 0 transparent; }
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        #victory-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .victory-text {
            font-size: 64px;
            font-weight: 900;
            color: var(--accent-color);
            text-shadow: 0 0 20px var(--accent-color);
            margin-bottom: 24px;
            animation: pop 0.5s ease-out;
        }

        .event-log-wrapper {
            grid-area: log;
            background-color: var(--secondary-bg, #222);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }
        .event-log-wrapper h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 16px;
            color: var(--text-color);
        }
        .event-log {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .log-entry {
            padding: 8px 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--accent-color);
            font-size: 14px;
            border-radius: 0 4px 4px 0;
            animation: slide-in 0.3s ease-out;
        }
        .log-entry.bingo {
            border-left-color: gold;
            color: gold;
            font-weight: bold;
        }
        .log-entry.one-to-bingo {
            border-left-color: orange;
            color: orange;
        }
        @keyframes slide-in {
            from { transform: translateX(-10px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .main-layout {
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr;
            grid-template-areas:
                "board"
                "sidebar"
                "log";
        }
        .main-board-section {
            grid-area: board;
        }
        .opponents-sidebar {
            grid-area: sidebar;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }
        @media (min-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr auto;
                grid-template-areas:
                    "board sidebar"
                    "log   sidebar";
            }
            .opponents-sidebar {
                width: 150px;
                flex-direction: column;
                justify-content: flex-start;
            }
        }
        .mini-board-wrapper {
            background-color: rgba(0, 0, 0, 0.1);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 150px;
            box-sizing: border-box;
        }
        .mini-board-label {
            font-size: 12px;
            margin-bottom: 4px;
            text-align: center;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mini-board {
            display: grid;
            gap: 2px;
        }
        .mini-tile {
            aspect-ratio: 1 / 1;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            transition: background-color 0.2s;
        }
        .mini-tile.marked {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body hx-ext="ws" ws-connect="/ws/room/{{.Slug}}" hx-on:htmx:ws-open="document.getElementById('connection-status').style.display='none'">
    <div class="window" style="max-width: 800px;">
        <div class="title-bar">
            <div class="title-bar-text">Bingo Room - {{.Slug}}</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <header class="header">
                <div>
                    <h1>Room: {{.Slug}}</h1>
                    <label id="connection-status" style="display: block; margin-top: 4px;">Connecting to server...</label>
                </div>
                <div class="controls">
                    <button class="cs-btn" id="share-btn" onclick="copyWordleResult()">Share Result</button>
                    <button class="cs-btn" id="copy-btn" onclick="copyLink()">Copy Link</button>
                    <button class="cs-btn" onclick="toggleTheme()">Theme</button>
                </div>
            </header>
            
            <div class="main-layout">
                <div class="main-board-section">
                    <div id="game-board-container">
                        <div style="padding: 40px; text-align: center; color: #aaa;">
                            Waiting for game state from server...
                        </div>
                    </div>
                </div>
                <div id="opponents-sidebar" class="opponents-sidebar" style="display: none;">
                    
                </div>
                {{if not .IsCollaborative}}
                <div class="event-log-wrapper">
                    <h3>Activity Log</h3>
                    <div id="event-log" class="event-log"></div>
                </div>
                {{end}}
            </div>
        </div>
    </div>
</body>
</html>
